<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Travel Journey — Smart AI Travel Planning</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>
  <body>
    <div id="app" class="app-container">
      <!-- Dark Sidebar -->
      <aside class="sidebar">
        <div class="brand" style="cursor: pointer;" data-route="/">
          <i class="fa-solid fa-mountain-sun logo-icon"></i>
          <h1>Travel Journey</h1>
        </div>
        <nav class="side-nav">
          <a href="/" class="nav-item active" data-route="/">
            <i class="fa-solid fa-house"></i> Home
          </a>
          <a href="/trips" class="nav-item" data-route="/trips">
            <i class="fa-regular fa-map"></i> My Trips
          </a>
          <a href="/discover" class="nav-item" data-route="/discover">
            <i class="fa-regular fa-compass"></i> Discover
          </a>
          <a href="/saved-places" class="nav-item" data-route="/saved-places">
            <i class="fa-regular fa-heart"></i> Saved Places
          </a>
          <a href="/travel-tips" class="nav-item" data-route="/travel-tips">
            <i class="fa-regular fa-lightbulb"></i> Travel Tips
          </a>
          <a href="/settings" class="nav-item" data-route="/settings">
            <i class="fa-solid fa-gear"></i> Settings
          </a>
        </nav>
        <div class="sidebar-footer">
          <div class="sidebar-graphic">
            <i class="fa-solid fa-plane-departure"></i>
          </div>
          <p>Better journeys<br>brighter tomorrows</p>
          <small>Explore. Plan. Travel. Repeat.</small>
        </div>
      </aside>
      
      <!-- Main Content Area -->
      <main class="main-content">
        <!-- Top header / Profile -->
        <header class="top-header">
           <div class="greeting-area">
             <h2 id="greeting-title">Hello, Explorer!</h2>
             <p>Dream destinations. Smarter plans. Let AI craft your next adventure.</p>
           </div>
           <div class="profile-menu">
              <button type="button" class="user-profile" id="profile-menu-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="profile-dropdown">
                 <img src="https://i.pravatar.cc/150?img=11" alt="" class="avatar">
                 <span class="user-info">
                    <span class="user-name" id="profile-name">Explorer</span>
                    <span class="user-action">Adventure awaits <i class="fa-solid fa-chevron-down profile-chevron"></i></span>
                 </span>
              </button>
              <ul class="profile-dropdown" id="profile-dropdown" role="menu" aria-labelledby="profile-menu-btn" hidden>
                 <li role="none"><a href="/plan" role="menuitem" data-route="/plan"><i class="fa-solid fa-wand-magic-sparkles"></i> Plan a trip</a></li>
                 <li role="none"><a href="/trips" role="menuitem" data-route="/trips"><i class="fa-regular fa-map"></i> My Trips</a></li>
                 <li role="none"><a href="/saved-places" role="menuitem" data-route="/saved-places"><i class="fa-regular fa-heart"></i> Saved Places</a></li>
                 <li role="none" class="profile-dropdown-sep"><a href="/settings" role="menuitem" data-route="/settings"><i class="fa-solid fa-gear"></i> Settings</a></li>
              </ul>
           </div>
        </header>

        <!-- Dynamic router view -->
        <div id="router-view"></div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
